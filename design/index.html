<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Atlas — multi-mode assistant · design prototype</title>
<style>
/* ============================================================
   ATLAS DESIGN SYSTEM
   Dark-only. Material 3 elevation logic (tonal, not shadow-led).
   ============================================================ */

/* ---------- 1. TOKENS: base surfaces, text, lines, motion ---------- */
:root{
  /* Surface ramp — elevation = tone shift first, shadow second */
  --s-0:#0F0F10;            /* app canvas            */
  --s-1:#141517;            /* sidebar / rail        */
  --s-2:#1A1B1E;            /* cards, composer       */
  --s-3:#212327;            /* hover, raised card    */
  --s-4:#292B30;            /* popover, menu         */
  --s-inset:#0B0B0C;        /* wells: code, visor    */

  /* Text — all ≥ 4.5:1 on --s-0 (verified) */
  --tx-hi:#EDEEF0;          /* 16.5:1  body + headings */
  --tx-mid:#A9ADB5;         /*  8.5:1  secondary       */
  --tx-low:#7C8089;         /*  4.8:1  meta, captions  */
  --tx-dis:#4E5158;         /*  disabled — non-text only */

  /* Hairlines — never a hard 1px white border */
  --line:rgba(255,255,255,.055);
  --line-2:rgba(255,255,255,.10);

  /* Shadow ramp — soft, wide, low-opacity */
  --e-1:0 1px 2px rgba(0,0,0,.45);
  --e-2:0 4px 14px -4px rgba(0,0,0,.55), 0 1px 2px rgba(0,0,0,.4);
  --e-3:0 16px 40px -12px rgba(0,0,0,.72), 0 2px 8px rgba(0,0,0,.45);

  /* Neutral brand — used by LOGIN surface only */
  --brand:#8AA9FF;
  --brand-ink:#0A0E1C;

  /* Radius — overridden per section */
  --r-card:16px;
  --r-ctl:8px;
  --r-pill:999px;

  /* Spacing — 4px base */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px; --sp-8:32px;

  /* Type scale */
  --t-12:12px; --t-14:14px; --t-16:16px; --t-20:20px; --t-24:24px; --t-32:32px;

  /* Motion */
  --dur-fast:150ms; --dur:200ms; --dur-slow:250ms;
  --ease:cubic-bezier(.2,0,0,1);          /* ease-out, M3 emphasized-decel */
  --ease-io:cubic-bezier(.4,0,.2,1);

  --rail:264px;
  --font:"Google Sans","Inter","Söhne",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono","SF Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
}

/* ---------- 2. TOKENS: per-section accent identity ---------- */
/* Each section inherits the base ramp. Only accent / radius / icon weight shift. */

[data-section="chat"]{
  --acc:#8AA9FF;                       /* 8.4:1 on --s-0 */
  --acc-2:#B190FF;
  --acc-grad:linear-gradient(135deg,#8AA9FF 0%,#B190FF 100%);
  --acc-ink:#0A0E1C;
  --acc-soft:rgba(138,169,255,.11);
  --acc-line:rgba(138,169,255,.24);
  --acc-ring:rgba(138,169,255,.42);
  --acc-glow:rgba(138,169,255,.30);
  --r-card:16px; --r-ctl:8px; --r-bubble:18px;
  --icon-w:1.75;                       /* rounded, friendly stroke */
  --icon-cap:round;
}
[data-section="learning"]{
  --acc:#F0B54A;                       /* 10.4:1 */
  --acc-2:#3BC9B4;                     /*  9.3:1 */
  --acc-grad:linear-gradient(135deg,#F0B54A 0%,#3BC9B4 100%);
  --acc-ink:#1B1405;
  --acc-soft:rgba(240,181,74,.10);
  --acc-line:rgba(240,181,74,.24);
  --acc-ring:rgba(240,181,74,.42);
  --acc-glow:rgba(240,181,74,.30);
  --r-card:16px; --r-ctl:8px; --r-bubble:18px;
  --icon-w:1.75;
  --icon-cap:round;
}
[data-section="code"]{
  --acc:#5BE0A0;                       /* 11.5:1 */
  --acc-2:#54D2E8;                     /* 10.7:1 */
  --acc-grad:linear-gradient(135deg,#5BE0A0 0%,#54D2E8 100%);
  --acc-ink:#04140C;
  --acc-soft:rgba(91,224,160,.09);
  --acc-line:rgba(91,224,160,.22);
  --acc-ring:rgba(91,224,160,.40);
  --acc-glow:rgba(91,224,160,.28);
  --r-card:8px; --r-ctl:6px; --r-bubble:10px;   /* sharper, technical */
  --icon-w:1.6;                                  /* tighter, angular   */
  --icon-cap:butt;
}

/* Syntax palette (code section wells) */
:root{
  --syn-key:#7BD8F0; --syn-str:#9BE3A8; --syn-num:#F0B54A;
  --syn-fn:#8AA9FF;  --syn-com:#666B74; --syn-pun:#8E949E;
}

/* ---------- 3. RESET ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--s-0); color:var(--tx-hi);
  font-family:var(--font); font-size:var(--t-14); line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden;
}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
svg{display:block}
:focus{outline:none}
:focus-visible{
  outline:none;
  box-shadow:0 0 0 2px var(--s-0), 0 0 0 4px var(--acc-ring);
  border-radius:inherit;
}
::selection{background:var(--acc-soft);color:var(--tx-hi)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2C2E33;border:3px solid transparent;background-clip:content-box;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#3A3D43;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   4. APP SHELL
   ============================================================ */
.app{display:flex;height:100dvh;overflow:hidden}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:var(--rail); flex:0 0 var(--rail);
  background:var(--s-1);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column;
  padding:var(--sp-3);
  transition:width var(--dur-slow) var(--ease), flex-basis var(--dur-slow) var(--ease);
  z-index:40;
}
.sb-head{display:flex;align-items:center;gap:var(--sp-2);height:40px;padding:0 var(--sp-2);margin-bottom:var(--sp-3)}
.mark{
  width:26px;height:26px;flex:0 0 26px;border-radius:9px;
  background:var(--acc-grad);
  display:grid;place-items:center;
  transition:background var(--dur-slow) var(--ease);
}
.mark svg{width:15px;height:15px;color:#0B0C10}
.wordmark{font-size:var(--t-16);font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.sb-head .icon-btn{margin-left:auto}

/* New Chat */
.new-chat{
  display:flex;align-items:center;gap:10px;
  height:42px;padding:0 var(--sp-3);
  border-radius:var(--r-ctl);
  background:var(--s-3);
  color:var(--tx-hi);font-size:var(--t-14);font-weight:500;
  box-shadow:var(--e-1);
  transition:background var(--dur) var(--ease),transform var(--dur-fast) var(--ease),box-shadow var(--dur) var(--ease);
}
.new-chat svg{width:18px;height:18px;flex:0 0 18px;color:var(--acc);transition:color var(--dur-slow) var(--ease)}
.new-chat:hover{background:var(--s-4);box-shadow:var(--e-2)}
.new-chat:active{transform:scale(.985);background:var(--s-3)}

/* Nav */
.nav,.recents{display:flex;flex-direction:column;gap:2px;margin-top:var(--sp-6)}
.nav-label{
  margin:0 0 var(--sp-2);padding:0 var(--sp-3);
  font-size:var(--t-12);font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  color:var(--tx-low);
}
.nav-item{
  position:relative;display:flex;align-items:center;gap:12px;
  height:40px;padding:0 var(--sp-3);border-radius:var(--r-ctl);
  color:var(--tx-mid);font-size:var(--t-14);font-weight:500;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur-fast) var(--ease);
}
.nav-item svg{width:19px;height:19px;flex:0 0 19px;transition:color var(--dur) var(--ease)}
.nav-item span{white-space:nowrap}
.nav-item:hover{background:var(--s-2);color:var(--tx-hi)}
.nav-item:active{transform:scale(.985)}
.nav-item[aria-current="page"]{background:var(--nav-soft);color:var(--tx-hi)}
.nav-item[aria-current="page"] svg{color:var(--nav-acc)}
.nav-item[aria-current="page"]::before{
  content:"";position:absolute;left:0;top:50%;translate:0 -50%;
  width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--nav-acc);
}
/* Each nav row carries its own accent so identity reads before you click */
.nav-item[data-go="chat"]    {--nav-acc:#8AA9FF;--nav-soft:rgba(138,169,255,.11)}
.nav-item[data-go="learning"]{--nav-acc:#F0B54A;--nav-soft:rgba(240,181,74,.10)}
.nav-item[data-go="code"]    {--nav-acc:#5BE0A0;--nav-soft:rgba(91,224,160,.09)}

/* Recents */
.recents{flex:1;min-height:0;overflow-y:auto;margin-top:var(--sp-6)}
.rec{
  display:block;height:34px;line-height:34px;padding:0 var(--sp-3);
  border-radius:var(--r-ctl);color:var(--tx-mid);font-size:var(--t-14);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-decoration:none;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
}
.rec:hover{background:var(--s-2);color:var(--tx-hi)}

/* ---------- 4b. LOGIN / ACCOUNT (neutral accent) ---------- */
.account{position:relative;margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--line)}
.acct-btn{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:var(--sp-2);border-radius:var(--r-ctl);
  transition:background var(--dur) var(--ease);
}
.acct-btn:hover{background:var(--s-2)}
.acct-btn[aria-expanded="true"]{background:var(--s-3)}
.avatar{
  position:relative;width:30px;height:30px;flex:0 0 30px;border-radius:var(--r-pill);
  display:grid;place-items:center;
  background:#33363C;color:var(--tx-hi);
  font-size:var(--t-12);font-weight:600;letter-spacing:.02em;
}
.status-dot{
  position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:var(--r-pill);
  background:#3BC98A;box-shadow:0 0 0 2.5px var(--s-1);
  transition:box-shadow var(--dur) var(--ease);
}
.acct-btn:hover .status-dot{box-shadow:0 0 0 2.5px var(--s-2)}
.acct-meta{display:flex;flex-direction:column;align-items:flex-start;min-width:0;line-height:1.35}
.acct-name{font-size:var(--t-14);font-weight:500;color:var(--tx-hi);white-space:nowrap}
.acct-sub{font-size:var(--t-12);color:var(--tx-low);white-space:nowrap}
.acct-btn .chev{width:16px;height:16px;margin-left:auto;color:var(--tx-low);transition:transform var(--dur) var(--ease)}
.acct-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}

.acct-pop{
  position:absolute;left:0;bottom:calc(100% + 8px);width:252px;
  background:var(--s-4);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--e-3);padding:var(--sp-2);
  opacity:0;transform:translateY(6px) scale(.98);transform-origin:bottom left;
  pointer-events:none;
  transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);
  z-index:60;
}
.acct-pop.open{opacity:1;transform:none;pointer-events:auto}
.pop-head{display:flex;gap:10px;align-items:center;padding:var(--sp-2) var(--sp-2) var(--sp-3)}
.pop-head .avatar{width:36px;height:36px;flex:0 0 36px;font-size:var(--t-14)}
.pop-head .status-dot{box-shadow:0 0 0 2.5px var(--s-4)}
.pop-mail{font-size:var(--t-12);color:var(--tx-low)}
.pop-sep{height:1px;background:var(--line);margin:var(--sp-1) 0}
.pop-item{
  display:flex;align-items:center;gap:10px;width:100%;
  height:36px;padding:0 var(--sp-2);border-radius:var(--r-ctl);
  color:var(--tx-mid);font-size:var(--t-14);
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
}
.pop-item svg{width:17px;height:17px;flex:0 0 17px}
.pop-item:hover{background:rgba(255,255,255,.055);color:var(--tx-hi)}
.pop-item .kbd{margin-left:auto;font-size:var(--t-12);color:var(--tx-dis);font-family:var(--mono)}
.pop-cta{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  height:38px;margin-top:var(--sp-2);border-radius:var(--r-ctl);
  background:var(--brand);color:var(--brand-ink);font-size:var(--t-14);font-weight:600;
  transition:filter var(--dur) var(--ease),transform var(--dur-fast) var(--ease);
}
.pop-cta:hover{filter:brightness(1.08)}
.pop-cta:active{transform:scale(.985);filter:brightness(.96)}

/* ---------- 5. MAIN ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{
  height:56px;flex:0 0 56px;display:flex;align-items:center;gap:var(--sp-2);
  padding:0 var(--sp-4);border-bottom:1px solid transparent;
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease);
}
.main[data-scrolled="1"] .topbar{border-bottom-color:var(--line);background:rgba(15,15,16,.72);backdrop-filter:blur(12px)}
.icon-btn{
  width:34px;height:34px;display:grid;place-items:center;border-radius:var(--r-ctl);
  color:var(--tx-mid);
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease),transform var(--dur-fast) var(--ease);
}
.icon-btn svg{width:18px;height:18px}
.icon-btn:hover{background:var(--s-2);color:var(--tx-hi)}
.icon-btn:active{transform:scale(.94)}
.crumb{display:flex;align-items:center;gap:9px;font-size:var(--t-14);font-weight:500}
.mode-dot{width:7px;height:7px;border-radius:var(--r-pill);background:var(--acc);transition:background var(--dur-slow) var(--ease)}
.spacer{flex:1}
.chip{
  display:flex;align-items:center;gap:7px;height:32px;padding:0 12px;
  border-radius:var(--r-pill);background:var(--s-2);
  color:var(--tx-mid);font-size:var(--t-12);font-weight:500;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
}
.chip:hover{background:var(--s-3);color:var(--tx-hi)}

/* Stage / thread */
.stage{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.col{max-width:760px;margin:0 auto;padding:var(--sp-6) var(--sp-6) var(--sp-8);width:100%}
/* extra bottom padding clears the mascot's perch — Code only */
[data-section="code"] .col{padding-bottom:96px}
[data-section="code"] .col{max-width:860px}

/* When empty, the dock becomes the hero and floats to optical center */
.main[data-empty="1"] .stage{flex:0 1 auto;overflow:visible}
.main[data-empty="1"]{justify-content:center}

/* ---------- 6. GREETING (empty state) ---------- */
.hero{max-width:760px;margin:0 auto var(--sp-6);padding:0 var(--sp-6);width:100%}
.main[data-empty="0"] .hero,
.main[data-empty="0"] .suggest{display:none}
.greet{
  margin:0 0 var(--sp-2);font-size:var(--t-32);font-weight:500;letter-spacing:-.02em;line-height:1.2;
}
.greet .accent{
  background:var(--acc-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.greet-sub{margin:0;font-size:var(--t-16);color:var(--tx-mid);max-width:46ch}
/* reserve the mascot's perch so the greeting never runs under it — Code only */
[data-section="code"] .main[data-empty="1"] .hero{padding-right:calc(var(--sp-6) + 112px)}

/* ---------- 7. DOCK: mascot + composer ---------- */
.dock{flex:0 0 auto;padding:0 var(--sp-6) var(--sp-4);position:relative}
/* soft fade so scrolled content dissolves into the dock instead of colliding */
.dock::before{
  content:"";position:absolute;left:0;right:0;bottom:100%;height:40px;
  background:linear-gradient(to top,var(--s-0),transparent);
  pointer-events:none;opacity:0;transition:opacity var(--dur) var(--ease);
}
.main[data-empty="0"] .dock::before{opacity:1}
.dock-inner{max-width:760px;margin:0 auto;position:relative}
[data-section="code"] .dock-inner{max-width:860px}

.composer{
  position:relative;
  background:var(--s-2);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  box-shadow:var(--e-2);
  padding:var(--sp-3) var(--sp-3) var(--sp-2);
  transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),
             background var(--dur) var(--ease),border-radius var(--dur-slow) var(--ease);
}
.composer:hover{border-color:var(--line-2)}
.composer:focus-within{
  border-color:var(--acc-line);
  box-shadow:var(--e-2), 0 0 0 3px var(--acc-soft);
}
.composer textarea{
  display:block;width:100%;border:0;background:none;resize:none;
  font-size:var(--t-16);line-height:1.6;color:var(--tx-hi);
  min-height:26px;max-height:180px;padding:2px 2px 0;
}
.composer textarea::placeholder{color:var(--tx-low)}
[data-section="code"] .composer textarea{font-family:var(--mono);font-size:var(--t-14)}
.composer-row{display:flex;align-items:center;gap:var(--sp-1);margin-top:var(--sp-2)}
/* controls scoped to a single section — specificity must beat .tool-btn below */
.composer-row .only-learning{display:none}
[data-section="learning"] .composer-row .only-learning{display:flex}
.tool-btn{
  display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;border-radius:var(--r-ctl);
  color:var(--tx-low);font-size:var(--t-12);font-weight:500;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
}
.tool-btn svg{width:16px;height:16px}
.tool-btn:hover{background:var(--s-3);color:var(--tx-hi)}
.tool-btn[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc)}
.send{
  margin-left:auto;width:34px;height:34px;border-radius:var(--r-ctl);
  display:grid;place-items:center;
  background:var(--s-3);color:var(--tx-dis);
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease),
             transform var(--dur-fast) var(--ease),opacity var(--dur) var(--ease);
}
.send svg{width:17px;height:17px}
.send:disabled{cursor:not-allowed;opacity:.55}
.composer.armed .send{background:var(--acc-grad);color:var(--acc-ink)}
.composer.armed .send:hover{filter:brightness(1.08)}
.composer.armed .send:active{transform:scale(.92)}
.disclaimer{margin:10px 0 0;text-align:center;font-size:var(--t-12);color:var(--tx-dis)}

/* Suggestions */
.suggest{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-4);justify-content:center}
.sug{
  display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;
  border-radius:var(--r-pill);background:var(--s-2);border:1px solid var(--line);
  color:var(--tx-mid);font-size:var(--t-14);
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease),
             border-color var(--dur) var(--ease),transform var(--dur-fast) var(--ease);
}
[data-section="code"] .sug{border-radius:var(--r-ctl);font-family:var(--mono);font-size:var(--t-12)}
.sug svg{width:15px;height:15px;color:var(--acc)}
.sug:hover{background:var(--s-3);color:var(--tx-hi);border-color:var(--acc-line)}
.sug:active{transform:scale(.98)}

/* ---------- 8. MESSAGES ---------- */
.msg{display:flex;gap:14px;margin-bottom:var(--sp-6);animation:msgIn 260ms var(--ease) both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end}
.bubble{
  max-width:78%;padding:11px 16px;border-radius:var(--r-bubble);
  font-size:var(--t-16);line-height:1.65;
}
.msg.user .bubble{background:var(--s-3);border-bottom-right-radius:6px;color:var(--tx-hi)}
/* wrapper so an attached-source chip doesn't squeeze the bubble below it */
.msg.user > div{display:flex;flex-direction:column;align-items:flex-end;max-width:78%}
.msg.user > div .bubble{max-width:100%}
.msg.ai .bubble{max-width:100%;padding:0;background:none}
.ai-avatar{
  width:28px;height:28px;flex:0 0 28px;border-radius:var(--r-pill);
  background:var(--acc-soft);border:1px solid var(--acc-line);
  display:grid;place-items:center;margin-top:2px;
}
.ai-avatar svg{width:15px;height:15px;color:var(--acc)}
.msg.ai p{margin:0 0 var(--sp-3)}
.msg.ai p:last-child{margin-bottom:0}
.cursor{display:inline-block;width:7px;height:16px;translate:0 2px;background:var(--acc);border-radius:1px;animation:blink 1s steps(2,end) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- 9. LEARNING blocks ---------- */
.lesson-head{display:flex;align-items:center;gap:14px;padding:var(--sp-4);background:var(--s-2);border-radius:var(--r-card);margin-bottom:var(--sp-4)}
.ring{width:44px;height:44px;flex:0 0 44px}
.ring circle{fill:none;stroke-width:4;stroke-linecap:round}
.ring .track{stroke:rgba(255,255,255,.08)}
.ring .bar{stroke:var(--acc);transform:rotate(-90deg);transform-origin:50% 50%;
  stroke-dasharray:113;stroke-dashoffset:113;animation:ringFill 900ms var(--ease) 120ms forwards}
@keyframes ringFill{to{stroke-dashoffset:45}}
.lesson-title{font-size:var(--t-16);font-weight:600;margin:0}
.lesson-meta{font-size:var(--t-12);color:var(--tx-low);margin:2px 0 0}
.pill{margin-left:auto;display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-pill);
  background:var(--acc-soft);color:var(--acc);font-size:var(--t-12);font-weight:600}

.step{border:1px solid var(--line);border-radius:var(--r-card);background:var(--s-2);margin-bottom:var(--sp-2);overflow:hidden;
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease)}
.step:hover{border-color:var(--line-2)}
.step[open]{background:var(--s-2)}
.step summary{
  display:flex;align-items:center;gap:12px;padding:var(--sp-3) var(--sp-4);cursor:pointer;list-style:none;
  font-size:var(--t-14);font-weight:500;
}
.step summary::-webkit-details-marker{display:none}
.step .tick{width:20px;height:20px;flex:0 0 20px;border-radius:var(--r-pill);
  border:1.75px solid var(--line-2);display:grid;place-items:center;color:transparent;
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease),color var(--dur) var(--ease)}
.step[data-done="1"] .tick{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.step .tick svg{width:12px;height:12px}
.step .caret{margin-left:auto;width:16px;height:16px;color:var(--tx-low);transition:transform var(--dur) var(--ease)}
.step[open] .caret{transform:rotate(180deg)}
.step-body{padding:0 var(--sp-4) var(--sp-4) 46px;font-size:var(--t-14);color:var(--tx-mid);line-height:1.7}
.diagram{margin-top:var(--sp-3);padding:var(--sp-4);background:var(--s-inset);border-radius:12px;border:1px solid var(--line)}
.diagram-cap{margin:var(--sp-3) 0 0;font-size:var(--t-12);color:var(--tx-low);text-align:center}

/* ---------- 10. CODE blocks ---------- */
.codeblock{
  background:var(--s-inset);border:1px solid var(--line);border-radius:var(--r-card);
  overflow:hidden;margin:var(--sp-3) 0;
}
.cb-head{
  display:flex;align-items:center;gap:9px;height:38px;padding:0 var(--sp-3);
  background:var(--s-2);border-bottom:1px solid var(--line);
}
.cb-dot{width:7px;height:7px;background:var(--acc);border-radius:1.5px}
.cb-name{font-family:var(--mono);font-size:var(--t-12);color:var(--tx-mid)}
.cb-lang{font-family:var(--mono);font-size:11px;color:var(--tx-low);padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.05)}
.cb-copy{
  margin-left:auto;display:flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:var(--r-ctl);
  color:var(--tx-low);font-size:var(--t-12);font-family:var(--mono);
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
}
.cb-copy svg{width:14px;height:14px}
.cb-copy:hover{background:rgba(255,255,255,.06);color:var(--tx-hi)}
.cb-copy.ok{color:var(--acc)}
.cb-body{display:flex;font-family:var(--mono);font-size:13px;line-height:1.75;overflow-x:auto}
.gutter{
  flex:0 0 auto;padding:var(--sp-3) 0 var(--sp-3) var(--sp-3);
  color:#4A4E56;text-align:right;user-select:none;min-width:44px;padding-right:12px;
  border-right:1px solid var(--line);
}
.code{padding:var(--sp-3) var(--sp-4);white-space:pre;color:var(--tx-hi);flex:1}
.k{color:var(--syn-key)} .s{color:var(--syn-str)} .n{color:var(--syn-num)}
.f{color:var(--syn-fn)}  .c{color:var(--syn-com);font-style:italic} .p{color:var(--syn-pun)}

/* ============================================================
   11. MASCOT — "BIT"
   Shared silhouette, per-section props, 3 named states.
   Animates transform + opacity only.
   ============================================================ */
/* CODE SECTION ONLY. Chat and Learning use the .proc dot cluster instead. */
.mascot{
  display:none;
  position:absolute; right:44px; bottom:100%;
  width:64px;height:82px;
  margin-bottom:-16px;              /* props overlap the composer edge */
  pointer-events:none; z-index:5;
  transition:width var(--dur-slow) var(--ease),height var(--dur-slow) var(--ease),
             right var(--dur-slow) var(--ease),margin-bottom var(--dur-slow) var(--ease);
}
[data-section="code"] .mascot{display:block}
.main[data-empty="1"] .mascot{width:96px;height:122px;right:36px;margin-bottom:-22px}
.mascot svg{
  position:absolute;inset:0;width:100%;height:100%;
  opacity:0;transition:opacity var(--dur-slow) var(--ease-io);
}
[data-section="code"] .mascot .v-code{opacity:1}

/* SVG transform hygiene */
.mascot [class^="m-"],.mascot [class*=" m-"]{transform-box:view-box;transform-origin:50px 70px}

/* --- shared parts --- */
.m-shell{fill:#C9CDD6}
.m-shell-2{fill:#9AA0AC}
.m-visor{fill:#0B0C0E}
.m-eye{fill:var(--acc);filter:drop-shadow(0 0 3px var(--acc-glow))}
.m-mouth{stroke:var(--acc);stroke-width:2.2;stroke-linecap:round;fill:none;opacity:.85}
.m-bulb{fill:var(--acc);filter:drop-shadow(0 0 4px var(--acc-glow))}
.m-stalk{stroke:#9AA0AC;stroke-width:2.6;stroke-linecap:round}
.m-panel{fill:var(--acc);opacity:.22}

/* --- IDLE: breathing bob --- */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.mascot .m-rig{animation:bob 2.8s var(--ease-io) infinite}

/* --- THINKING --- */
@keyframes leanIn{to{transform:translateY(2px) rotate(7deg)}}
@keyframes eyePulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes dotRise{
  0%{opacity:0;transform:translateY(4px) scale(.5)}
  30%{opacity:1;transform:translateY(-2px) scale(1)}
  70%{opacity:.9;transform:translateY(-6px) scale(1)}
  100%{opacity:0;transform:translateY(-12px) scale(.6)}
}
.m-think{opacity:0;transition:opacity var(--dur) var(--ease)}
.mascot[data-state="thinking"] .m-rig{animation:bob 2.8s var(--ease-io) infinite, leanIn 300ms var(--ease-io) forwards}
.mascot[data-state="thinking"] .m-eye{animation:eyePulse 800ms var(--ease-io) infinite}
.mascot[data-state="thinking"] .m-think{opacity:1}
.mascot[data-state="thinking"] .m-dot{animation:dotRise 1.4s var(--ease-io) infinite}
.mascot[data-state="thinking"] .m-dot:nth-child(2){animation-delay:.22s}
.mascot[data-state="thinking"] .m-dot:nth-child(3){animation-delay:.44s}

/* --- ANSWERING --- */
@keyframes sparkPop{
  0%{opacity:0;transform:scale(.3) rotate(-18deg)}
  35%{opacity:1;transform:scale(1.15) rotate(0deg)}
  100%{opacity:0;transform:scale(.85) rotate(10deg)}
}
@keyframes eyeFlash{0%{transform:scale(1)}40%{transform:scale(1.55)}100%{transform:scale(1)}}
@keyframes straighten{0%{transform:rotate(7deg)}55%{transform:rotate(-3deg)}100%{transform:rotate(0)}}
.m-spark{opacity:0;transform-origin:50px 4px}
.mascot[data-state="answering"] .m-rig{animation:bob 2.8s var(--ease-io) infinite, straighten 320ms var(--ease) forwards}
.mascot[data-state="answering"] .m-spark{animation:sparkPop 400ms var(--ease) forwards}
.mascot[data-state="answering"] .m-eye{animation:eyeFlash 300ms var(--ease)}
.mascot[data-state="answering"] .m-mouth{opacity:1}

/* --- CODE variant --- */
.m-head{transform-origin:50px 62px;transition:transform 300ms var(--ease-io)}
.m-desk{fill:#26282D} .m-chair{fill:#33363C}
.m-lap{fill:#3A3E45} .m-screen{fill:#07100C}
.m-line-1{fill:var(--syn-key)} .m-line-2{fill:var(--syn-str)} .m-line-3{fill:var(--syn-num)}
@keyframes tapL{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes tapR{0%,100%{transform:translateY(-2.5px)}50%{transform:translateY(0)}}
@keyframes synShift{0%,45%{opacity:1}55%,100%{opacity:0}}
@keyframes glowPulse{0%,100%{opacity:.30}50%{opacity:.72}}
.m-handL{animation:tapL 360ms var(--ease-io) infinite}
.m-handR{animation:tapR 360ms var(--ease-io) infinite}
.m-syn-b{animation:synShift 2.6s steps(1,end) infinite}
.m-glow{opacity:.30;animation:glowPulse 3.4s var(--ease-io) infinite}
.mascot[data-state="thinking"] .m-handL{animation-duration:190ms}
.mascot[data-state="thinking"] .m-handR{animation-duration:190ms}
.mascot[data-state="thinking"] .m-glow{animation-duration:900ms}
.m-check{opacity:0;transform-origin:66px 78px}
@keyframes checkPop{0%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1.12)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.mascot[data-state="answering"] .m-check{animation:checkPop 900ms var(--ease) forwards}
.mascot[data-state="answering"] .m-handL,
.mascot[data-state="answering"] .m-handR{animation-play-state:paused}

/* ============================================================
   11b. PROCESSING INDICATOR — shared by Chat + Learning
   Lives inline in the response area. Mounted on submit,
   unmounted on the first streamed token.
   ============================================================ */
.proc{display:flex;gap:14px;margin-bottom:var(--sp-6);animation:msgIn 200ms var(--ease) both}
.proc-dots{display:flex;align-items:center;gap:6px;height:28px;padding-top:2px}
.proc-dots i{
  width:7px;height:7px;border-radius:var(--r-pill);
  background:var(--acc);
  opacity:.35;transform:scale(.78);
  animation:procPulse 750ms var(--ease-io) infinite;
  will-change:opacity,transform;
}
.proc-dots i:nth-child(2){animation-delay:130ms}
.proc-dots i:nth-child(3){animation-delay:260ms}
@keyframes procPulse{
  0%,100%{opacity:.32;transform:scale(.78)}
  50%    {opacity:1;  transform:scale(1)}
}
/* one-shot fade-out so the swap to the first token isn't a hard cut */
.proc.leaving{animation:procOut 140ms var(--ease) forwards}
@keyframes procOut{to{opacity:0;transform:translateY(-2px)}}

/* ============================================================
   11c. MODEL SELECTOR — inside the composer, all three sections
   ============================================================ */
.model-wrap{position:relative}
.model-pill{
  display:flex;align-items:center;gap:7px;height:30px;padding:0 9px 0 8px;
  border-radius:var(--r-pill);
  color:var(--tx-mid);font-size:var(--t-12);font-weight:500;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
  max-width:190px;
}
[data-section="code"] .model-pill{border-radius:var(--r-ctl);font-family:var(--mono)}
.model-pill:hover{background:var(--s-3);color:var(--tx-hi)}
.model-pill[aria-expanded="true"]{background:var(--s-3);color:var(--tx-hi)}
.model-pill .chev{width:13px;height:13px;color:var(--tx-low);flex:0 0 13px;transition:transform var(--dur) var(--ease)}
.model-pill[aria-expanded="true"] .chev{transform:rotate(180deg)}
.model-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Auto-mode indicator: a soft accent orb, not an icon */
.auto-orb{
  width:7px;height:7px;flex:0 0 7px;border-radius:var(--r-pill);
  background:var(--acc);box-shadow:0 0 6px var(--acc-glow);
  animation:autoBreathe 2.6s var(--ease-io) infinite;
}
@keyframes autoBreathe{0%,100%{opacity:.55}50%{opacity:1}}
/* manual override → flat neutral dot, no glow, no motion */
.model-pill[data-mode="manual"] .auto-orb{background:var(--tx-low);box-shadow:none;animation:none}
/* hover reveals what Auto actually routed to */
.model-pill .routed{color:var(--tx-low);white-space:nowrap;max-width:0;overflow:hidden;
  transition:max-width var(--dur-slow) var(--ease),opacity var(--dur) var(--ease);opacity:0}
.model-pill[data-mode="auto"]:hover .routed{max-width:130px;opacity:1}

.model-pop{
  position:absolute;left:0;bottom:calc(100% + 8px);width:286px;
  background:var(--s-4);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--e-3);padding:var(--sp-2);z-index:70;
  opacity:0;transform:translateY(6px) scale(.98);transform-origin:bottom left;pointer-events:none;
  transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);
}
[data-section="code"] .model-pop{border-radius:var(--r-card)}
.model-pop.open{opacity:1;transform:none;pointer-events:auto}
.mp-group{margin-top:var(--sp-2)}
.mp-group:first-of-type{margin-top:var(--sp-1)}
.mp-label{
  margin:0;padding:var(--sp-1) var(--sp-2) var(--sp-1);
  font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--tx-low);
}
.mp-item{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:7px var(--sp-2);border-radius:var(--r-ctl);
  color:var(--tx-mid);font-size:var(--t-14);text-align:left;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
}
.mp-item:hover{background:rgba(255,255,255,.055);color:var(--tx-hi)}
.mp-item .mp-main{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.mp-item .mp-sub{font-size:var(--t-12);color:var(--tx-low)}
.mp-item .mp-check{width:15px;height:15px;margin-left:auto;color:var(--acc);opacity:0;flex:0 0 15px}
.mp-item[aria-selected="true"]{color:var(--tx-hi)}
.mp-item[aria-selected="true"] .mp-check{opacity:1}
.mp-auto{border-bottom:1px solid var(--line);border-radius:var(--r-ctl) var(--r-ctl) 0 0;padding-bottom:9px;margin-bottom:var(--sp-1)}
.mp-auto .auto-orb{margin-left:1px}

/* ============================================================
   11d. LEARNING — source chips + generated outputs
   ============================================================ */
.sources{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-bottom:var(--sp-2)}
.sources:empty{display:none}
.src-chip{
  display:flex;align-items:center;gap:9px;
  padding:6px 8px 6px 6px;border-radius:12px;
  background:var(--s-3);border:1px solid var(--line);
  animation:msgIn 200ms var(--ease) both;max-width:260px;
}
.src-thumb{
  width:36px;height:26px;flex:0 0 36px;border-radius:6px;overflow:hidden;
  background:var(--s-inset);display:grid;place-items:center;position:relative;
}
.src-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.src-thumb svg{width:15px;height:15px;color:var(--acc)}
.src-meta{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.src-title{font-size:var(--t-12);font-weight:500;color:var(--tx-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-kind{font-size:11px;color:var(--tx-low)}
.src-x{
  width:22px;height:22px;flex:0 0 22px;display:grid;place-items:center;border-radius:6px;
  color:var(--tx-low);transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
}
.src-x svg{width:13px;height:13px}
.src-x:hover{background:rgba(255,255,255,.07);color:var(--tx-hi)}

/* output-mode action cards */
.out-actions{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-4)}
.out-card{
  display:flex;align-items:center;gap:11px;
  padding:12px 15px;border-radius:var(--r-card);
  background:var(--s-2);border:1px solid var(--line);text-align:left;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur-fast) var(--ease);
}
.out-card:hover{background:var(--s-3);border-color:var(--acc-line)}
.out-card:active{transform:scale(.99)}
.out-card[disabled]{opacity:.45;cursor:not-allowed}
.out-ico{width:32px;height:32px;flex:0 0 32px;border-radius:9px;background:var(--acc-soft);display:grid;place-items:center}
.out-ico svg{width:17px;height:17px;color:var(--acc)}
.out-txt{display:flex;flex-direction:column;line-height:1.35}
.out-t{font-size:var(--t-14);font-weight:500;color:var(--tx-hi)}
.out-s{font-size:var(--t-12);color:var(--tx-low)}

/* study notes */
.notes{margin-top:var(--sp-4);padding:var(--sp-4) var(--sp-6);background:var(--s-2);border-radius:var(--r-card);border:1px solid var(--line)}
.notes h3{margin:0 0 var(--sp-3);font-size:var(--t-20);font-weight:600;letter-spacing:-.01em}
.notes h4{margin:var(--sp-4) 0 var(--sp-2);font-size:var(--t-14);font-weight:600;color:var(--acc);
  text-transform:uppercase;letter-spacing:.06em}
.notes ul{margin:0;padding-left:18px}
.notes li{margin-bottom:6px;color:var(--tx-mid);font-size:var(--t-14);line-height:1.7}
.notes li::marker{color:var(--tx-dis)}
.term{color:var(--tx-hi);font-weight:600;background:var(--acc-soft);
  padding:1px 5px;border-radius:5px;box-decoration-break:clone}

/* slides carousel */
.deck{margin-top:var(--sp-4);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;background:var(--s-2)}
.deck-stage{position:relative;aspect-ratio:16/9;background:var(--s-inset)}
.slide{
  position:absolute;inset:0;padding:var(--sp-6) var(--sp-8);
  display:flex;flex-direction:column;justify-content:center;
  opacity:0;transform:translateX(12px);pointer-events:none;
  transition:opacity var(--dur-slow) var(--ease),transform var(--dur-slow) var(--ease);
}
.slide.on{opacity:1;transform:none;pointer-events:auto}
.slide h3{margin:0 0 var(--sp-4);font-size:var(--t-24);font-weight:600;letter-spacing:-.02em;line-height:1.25}
.slide h3::after{content:"";display:block;width:36px;height:3px;border-radius:2px;background:var(--acc);margin-top:12px}
.slide ul{margin:0;padding-left:18px}
.slide li{margin-bottom:9px;color:var(--tx-mid);font-size:var(--t-16);line-height:1.55}
.slide li::marker{color:var(--acc)}
.deck-bar{display:flex;align-items:center;gap:var(--sp-2);padding:10px var(--sp-3);border-top:1px solid var(--line)}
.deck-n{font-size:var(--t-12);color:var(--tx-low);font-variant-numeric:tabular-nums}
.deck-dots{display:flex;gap:6px;margin:0 auto}
.deck-dots button{width:6px;height:6px;padding:0;flex:0 0 6px;border-radius:var(--r-pill);background:var(--line-2);
  transition:background var(--dur) var(--ease),transform var(--dur) var(--ease)}
.deck-dots button[aria-current="true"]{background:var(--acc);transform:scale(1.35)}
.deck-nav{width:28px;height:28px;border-radius:var(--r-ctl);display:grid;place-items:center;color:var(--tx-mid);
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.deck-nav svg{width:15px;height:15px}
.deck-nav:hover:not([disabled]){background:var(--s-3);color:var(--tx-hi)}
.deck-nav[disabled]{opacity:.3;cursor:not-allowed}

/* ---------- 12. RESPONSIVE ---------- */
/* < 1024px → icon-only rail */
@media (max-width:1023px){
  .app{--rail:72px}
  .sidebar{padding:var(--sp-3) 10px}
  .wordmark,.nav-item span,.acct-meta,.acct-btn .chev,.nav-label,.recents,.sb-toggle{display:none}
  .new-chat{justify-content:center;padding:0;width:52px;height:44px;margin:0 auto}
  .new-chat span{display:none}
  .nav{align-items:center;flex:1}
  .nav-item{justify-content:center;width:52px;padding:0}
  .nav-item::before{left:-10px}
  .sb-head{justify-content:center;padding:0}
  .acct-btn{justify-content:center;padding:var(--sp-2) 0}
  .acct-pop{left:calc(100% + 10px);bottom:0;transform-origin:bottom left}
  .col,.hero,.dock{padding-left:var(--sp-4);padding-right:var(--sp-4)}
}
/* User-driven collapse at ≥1024 mirrors the rail */
@media (min-width:1024px){
  .app[data-nav="collapsed"]{--rail:72px}
  .app[data-nav="collapsed"] .wordmark,
  .app[data-nav="collapsed"] .nav-item span,
  .app[data-nav="collapsed"] .acct-meta,
  .app[data-nav="collapsed"] .acct-btn .chev,
  .app[data-nav="collapsed"] .nav-label,
  .app[data-nav="collapsed"] .recents{display:none}
  .app[data-nav="collapsed"] .sidebar{padding:var(--sp-3) 10px}
  .app[data-nav="collapsed"] .sb-head{justify-content:center;padding:0}
  .app[data-nav="collapsed"] .new-chat{justify-content:center;padding:0;width:52px;height:44px;margin:0 auto}
  .app[data-nav="collapsed"] .new-chat span{display:none}
  .app[data-nav="collapsed"] .nav{align-items:center;flex:1}
  .app[data-nav="collapsed"] .nav-item{justify-content:center;width:52px;padding:0}
  .app[data-nav="collapsed"] .nav-item::before{left:-10px}
  .app[data-nav="collapsed"] .acct-btn{justify-content:center;padding:var(--sp-2) 0}
  .app[data-nav="collapsed"] .acct-pop{left:calc(100% + 10px);bottom:0}
  .only-mobile{display:none}
}
/* < 768px → slide-over drawer */
@media (max-width:767px){
  .app{--rail:264px}
  .sidebar{
    position:fixed;inset:0 auto 0 0;padding:var(--sp-3);
    transform:translateX(-100%);
    transition:transform var(--dur-slow) var(--ease);
    box-shadow:var(--e-3);
  }
  .app[data-drawer="open"] .sidebar{transform:none}
  /* undo the rail overrides — the drawer is the full-width sidebar again */
  .wordmark{display:inline}
  .nav-label{display:block}
  .nav-item span,.new-chat span{display:inline}
  .acct-meta{display:flex}
  .acct-btn .chev{display:block}
  .recents{display:flex}
  .new-chat{justify-content:flex-start;padding:0 var(--sp-3);width:auto;height:42px;margin:0}
  .nav{align-items:stretch}
  .nav-item{justify-content:flex-start;width:auto;padding:0 var(--sp-3)}
  .nav-item::before{left:0}
  .sb-head{justify-content:flex-start;padding:0 var(--sp-2)}
  .acct-btn{justify-content:flex-start;padding:var(--sp-2)}
  .acct-pop{left:0;bottom:calc(100% + 8px)}
  .scrim{
    position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;z-index:35;
    transition:opacity var(--dur-slow) var(--ease);
  }
  .app[data-drawer="open"] .scrim{opacity:1;pointer-events:auto}
  .greet{font-size:var(--t-24)}
  .greet-sub{font-size:var(--t-14)}
  .col,.hero,.dock{padding-left:var(--sp-4);padding-right:var(--sp-4)}
  .bubble{max-width:88%}
  .mascot{right:16px;width:56px;height:72px}
  .main[data-empty="1"] .mascot{width:72px;height:92px;right:14px}
  [data-section="code"] .main[data-empty="1"] .hero{padding-right:calc(var(--sp-4) + 84px)}
  .model-pop{width:min(286px,calc(100vw - 48px))}
  .suggest{justify-content:flex-start}
}
@media (min-width:768px){.scrim{display:none}.only-mobile{display:none}}
@media (max-width:767px){.only-mobile{display:grid}}

/* ---------- 13. REDUCED MOTION ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:1ms !important;animation-iteration-count:1 !important;
    transition-duration:1ms !important;scroll-behavior:auto !important;
  }
  /* Mascot: states become a plain opacity crossfade — no bob, lean, or spark */
  .mascot .m-rig,.m-handL,.m-handR,.m-glow,.m-syn-b{animation:none !important;transform:none !important}
  .mascot[data-state="thinking"] .m-eye{animation:none !important;opacity:.65}
  .m-think,.m-spark,.m-check{transition:opacity 120ms linear !important}
  .mascot[data-state="answering"] .m-spark,
  .mascot[data-state="answering"] .m-check{animation:none !important;opacity:1}
  .cursor{animation:none !important}

  /* Processing indicator: static soft-glow, no pulse */
  .proc-dots i{
    animation:none !important;
    opacity:.85 !important;transform:none !important;
    box-shadow:0 0 8px var(--acc-glow);
  }
  .proc.leaving{animation:none !important;opacity:0}
  /* Auto-mode orb stops breathing but keeps its glow */
  .auto-orb{animation:none !important;opacity:1 !important}
  /* Slides cross-fade in place instead of sliding */
  .slide{transform:none !important}
}

/* ---------- 14. Prototype control strip (not part of the product UI) ---------- */
.proto{
  position:fixed;right:14px;bottom:10px;z-index:80;

@media (max-width:767px){.proto{display:none}}

/* ---------- section config ---------- */

const modelPill = $("#modelPill"), modelPop = $("#modelPop");

function renderModelPill(){
  const auto = isAuto(section);
  const m = MODELS[resolveModel(section)];
  modelPill.dataset.mode = auto ? "auto" : "manual";
  $("#modelName").textContent = auto ? "Auto" : m.label;
  // hover reveal: "Auto · Claude Sonnet"
  $("#modelRouted").textContent = auto ? ` · ${m.label}` : "";
  modelPill.title = auto ? `Auto · routed to ${m.label} (${m.provider})` : `${m.label} · ${m.provider}`;
}

function renderModelPop(){
  const cur = modelChoice[section];
  const autoTarget = MODELS[AUTO_ROUTE[section]];
  const check = `<svg class="mp-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L19 8"/></svg>`;

  let html = `
    <button class="mp-item mp-auto" role="option" data-pick="auto" aria-selected="${cur === null}">
      <span class="auto-orb"></span>
      <span class="mp-main">
        <span>Auto</span>
        <span class="mp-sub">Routed by section → ${autoTarget.label}</span>
      </span>${check}
    </button>`;

  for(const prov of PROVIDER_ORDER){
    const ids = Object.keys(MODELS).filter(id => MODELS[id].provider === prov);
    if(!ids.length) continue;
    html += `<div class="mp-group"><p class="mp-label">${prov}</p>`;
    for(const id of ids){
      const m = MODELS[id];
      html += `

            <span>${m.label}</span>
            ${m.detail ? `<span class="mp-sub">${m.detail}</span>` : ""}
          </span>${check}
        </button>`;
    }
    html += `</div>`;
  }
  modelPop.innerHTML = html;
}

function closeModelPop(){
  modelPop.classList.remove("open");
  modelPill.setAttribute("aria-expanded","false");
}
modelPill.addEventListener("click", e => {

});
modelPop.addEventListener("click", e => {

  const pick = item.dataset.pick;

  renderModelPill();

const YT_RE = /https?:\/\/(?:www\.|m\.)?(?:youtube\.com\/(?:watch\?(?:[^\s]*&)?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})(?:[^\s]*)?/;

function addSource(src){
  if(sources.some(s => s.key === src.key)) return;   // no duplicates
  sources.push(src);

  syncArmed();

function removeSource(key){
  const i = sources.findIndex(s => s.key === key);
  if(i > -1){ sources.splice(i,1); renderSources(); syncArmed(); }
}

/* Pasting a YouTube URL turns it into a chip and strips it from the text */
function captureYouTube(){
  const m = input.value.match(YT_RE);

    key:"yt:"+id, kind:"YouTube", title:"youtu.be/"+id,
    thumb:`<img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt=""

function submit(text){
  if(!text && !sources.length) return;

  const attached = sources.slice();                          // snapshot for this turn
  main.dataset.empty = "0";

  const chips = attached.length
    ? `<div class="sources" style="margin:0 0 8px;justify-content:flex-end">` +
      attached.map(s => `<span class="src-chip"><span class="src-thumb">${s.thumb}</span>
        <span class="src-meta"><span class="src-title">${escapeHtml(s.title)}</span>
        <span class="src-kind">${s.kind}</span></span></span>`).join("") + `</div>`
    : "";
  thread.insertAdjacentHTML("beforeend",
    `<div class="msg user"><div>${chips}${text ? `<div class="bubble">${escapeHtml(text)}</div>` : ""}</div></div>`);

  input.value = ""; autosize();
  sources.length = 0; renderSources();
  composer.classList.remove("armed"); send.disabled = true;
  scrollEnd();

  showProc();                                                // idle → thinking on submit
  if(section === "code") setMascot("thinking");

  setTimeout(() => {                                         // first chunk arrives
    hideProc();                                              // indicator leaves the instant tokens start
    if(section === "code") setMascot("answering");
    stream(attached.length ? REPLIES.sourced : REPLIES[section]);
  }, 1400);
}

function stream(html){
  const wrap = document.createElement("div");
  wrap.className = "msg ai";
  wrap.innerHTML = AI_MARK + `<div class="bubble"><p id="live"></p></div>`;
  thread.appendChild(wrap); scrollEnd();

  const live = wrap.querySelector("#live");
  const words = html.lead.split(" ");
  let i = 0;
  const t = setInterval(() => {
    live.innerHTML = words.slice(0, ++i).join(" ") + '<span class="cursor"></span>';
    if(i % 5 === 0) scrollEnd();
    if(i >= words.length){
      clearInterval(t);
      live.innerHTML = words.join(" ");
      live.removeAttribute("id");
      wrap.querySelector(".bubble").insertAdjacentHTML("beforeend", html.body);
      wireCopy(wrap); wireOutputs(wrap); scrollEnd();
      if(section === "code") setMascot("idle");              // answering → idle on stream end
    }
  }, 34);
}

stage.addEventListener("scroll", () => main.dataset.scrolled = stage.scrollTop > 4 ? "1" : "0");

];

function renderSlides(){
  const slides = SLIDES.map((s,i) => `
    <section class="slide${i === 0 ? " on" : ""}" data-i="${i}" ${i ? 'aria-hidden="true"' : ""}>
      <h3>${s.t}</h3>
      <ul>${s.b.map(x => `<li>${x}</li>`).join("")}</ul>
    </section>`).join("");
  const dots = SLIDES.map((_,i) =>
    `<button data-goto="${i}" aria-current="${i === 0}" aria-label="Slide ${i+1}"></button>`).join("");
  return `
    <div class="deck">
      <div class="deck-stage">${slides}</div>
      <div class="deck-bar">
        <button class="deck-nav" data-step="-1" disabled aria-label="Previous slide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
        </button>
        <span class="deck-n"><span class="deck-cur">1</span> / ${SLIDES.length}</span>
        <span class="deck-dots">${dots}</span>
        <button class="deck-nav" data-step="1" aria-label="Next slide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </button>
      </div>
    </div>`;
}

function wireDeck(deck){
  const slides = [...deck.querySelectorAll(".slide")];
  const dots   = [...deck.querySelectorAll("[data-goto]")];
  const prev   = deck.querySelector('[data-step="-1"]');
  const next   = deck.querySelector('[data-step="1"]');
  let i = 0;
  const go = n => {
    i = Math.max(0, Math.min(SLIDES.length - 1, n));
    slides.forEach((s,k) => { s.classList.toggle("on", k === i); s.setAttribute("aria-hidden", String(k !== i)); });
    dots.forEach((d,k) => d.setAttribute("aria-current", String(k === i)));
    deck.querySelector(".deck-cur").textContent = i + 1;
    prev.disabled = i === 0;
    next.disabled = i === SLIDES.length - 1;
  };
  prev.addEventListener("click", () => go(i - 1));
  next.addEventListener("click", () => go(i + 1));
  dots.forEach(d => d.addEventListener("click", () => go(+d.dataset.goto)));
}

function wireOutputs(scope){
  scope.querySelectorAll("[data-out]").forEach(btn => btn.addEventListener("click", () => {
    const kind = btn.dataset.out;
    const box  = btn.closest(".bubble");
    btn.disabled = true;                     // only this format; the other stays available
    box.insertAdjacentHTML("beforeend", kind === "notes" ? STUDY_NOTES : renderSlides());
    if(kind === "slides") wireDeck(box.querySelector(".deck"));
    scrollEnd();
  }));
}

function wireCopy(scope){
  scope.querySelectorAll(".cb-copy").forEach(btn => btn.addEventListener("click", async () => {
    const code = btn.closest(".codeblock").querySelector(".code").innerText;
    try { await navigator.clipboard.writeText(code); } catch {}
    const label = btn.querySelector("span");
    btn.classList.add("ok"); label.textContent = "copied";
    setTimeout(() => { btn.classList.remove("ok"); label.textContent = "copy"; }, 1600);
  }));
}

/* ---------- shell controls ---------- */
$("#navToggle").addEventListener("click", () => {
  app.dataset.nav = app.dataset.nav === "collapsed" ? "expanded" : "collapsed";
});
$("#drawerBtn").addEventListener("click", () => app.dataset.drawer = "open");
$("#scrim").addEventListener("click", () => app.dataset.drawer = "closed");

const acctBtn = $("#acctBtn"), acctPop = $("#acctPop");
acctBtn.addEventListener("click", e => {
  e.stopPropagation();
  const open = acctPop.classList.toggle("open");
  acctBtn.setAttribute("aria-expanded", String(open));
});
document.addEventListener("click", e => {
  if(!e.target.closest(".account")){ acctPop.classList.remove("open"); acctBtn.setAttribute("aria-expanded","false"); }
  if(!e.target.closest(".model-wrap")) closeModelPop();      // closes on outside click
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    acctPop.classList.remove("open"); acctBtn.setAttribute("aria-expanded","false");
    closeModelPop();
    app.dataset.drawer = "closed";
  }
});

/* ---------- reset / demo ---------- */
function reset(){
  thread.innerHTML = "";
  procEl = null;
  main.dataset.empty = "1"; main.dataset.scrolled = "0";
  input.value = ""; autosize();
  sources.length = 0; renderSources();
  composer.classList.remove("armed"); send.disabled = true;
  closeModelPop();
  setMascot("idle");
}
$("#newChat").addEventListener("click", reset);
$("#resetBtn").addEventListener("click", reset);
$("#runDemo").addEventListener("click", () => { reset(); submit(SECTIONS[section].seed); });

$("#runSource").addEventListener("click", () => {
  setSection("learning");
  input.value = "Summarize this https://youtu.be/dQw4w9WgXcQ for me";
  input.dispatchEvent(new Event("input"));
  setTimeout(() => composer.requestSubmit(), 260);
});

setSection("chat");
// re-measure once webfonts land, so the composer never opens over-tall
if(document.fonts && document.fonts.ready) document.fonts.ready.then(autosize);
requestAnimationFrame(autosize);
})();
